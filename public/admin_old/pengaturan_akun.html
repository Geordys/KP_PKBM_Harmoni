<!doctype html>
<html lang="id">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pengaturan Akun - PKBM Harmoni</title>

    <!-- Reusing existing styles for consistency -->
    <!-- Reusing existing styles for consistency -->
    <link rel="stylesheet" href="../assets/css/kelola-beranda.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Specific styles for form cards */
        .settings-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            max-width: 600px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #334155;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .alert {
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: none;
            font-size: 14px;
        }

        .alert.success {
            background-color: #eff6ff;
            border: 1px solid #dbeafe;
            color: #1e40af;
        }

        .alert.error {
            background-color: #fef2f2;
            border: 1px solid #fee2e2;
            color: #991b1b;
        }

        .password-container {
            position: relative;
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            padding: 4px;
            cursor: pointer;
            color: #64748b;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .password-toggle:hover {
            color: #334155;
        }

        /* Custom SweetAlert2 Styling */
        .animated-popup {
            border-radius: 16px !important;
            padding: 30px !important;
        }

        .logout-confirm-btn {
            border-radius: 10px !important;
            padding: 12px 24px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3) !important;
            transition: all 0.2s ease !important;
        }

        .logout-confirm-btn:hover {
            transform: translateY(-2px) !important;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4) !important;
        }

        .logout-cancel-btn {
            border-radius: 10px !important;
            padding: 12px 24px !important;
            font-weight: 600 !important;
            font-size: 14px !important;
            background: #f1f5f9 !important;
            color: #64748b !important;
            transition: all 0.2s ease !important;
        }

        .logout-cancel-btn:hover {
            background: #e2e8f0 !important;
            transform: translateY(-2px) !important;
        }

        .swal2-icon.swal2-question {
            border-color: #2563eb !important;
            color: #2563eb !important;
        }

        .swal2-title {
            font-size: 24px !important;
            font-weight: 700 !important;
            color: #1e293b !important;
        }

        /* Logout Button at Bottom */
        .logout-bottom {
            position: absolute;
            left: 16px;
            right: 16px;
            bottom: 16px;
            padding: 0;
        }

        .btn-logout {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 18px;
            border-radius: 12px;
            background: linear-gradient(135deg, #dc2626 0%, #b91c1c 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.25);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            justify-content: center;
        }

        .btn-logout:hover {
            background: linear-gradient(135deg, #b91c1c 0%, #991b1b 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(220, 38, 38, 0.35);
        }

        .btn-logout:active {
            transform: translateY(0);
            box-shadow: 0 2px 8px rgba(220, 38, 38, 0.3);
        }

        .btn-logout svg {
            flex-shrink: 0;
        }

        .btn-logout span {
            font-weight: 700;
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>
    <div class="layout">

        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="brand">
                <img src="../assets/logo-pkbm.png" alt="Logo PKBM Harmoni">
                <div>
                    <div class="t1">ADMIN PANEL</div>
                    <div class="t2">PKBM Harmoni</div>
                    <div class="t3">Pengaturan Akun</div>
                </div>
            </div>

            <nav class="nav">
                <a href="dashboard_admin.html">
                    <div class="ico">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 13h8V3H3v10zM13 21h8V11h-8v10zM13 3h8v6h-8V3zM3 21h8v-6H3v6z" />
                        </svg>
                    </div>
                    Dashboard
                </a>

                <a href="kelola_pendaftaran.html">
                    <div class="ico">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 6h18M3 12h18M3 18h18" />
                        </svg>
                    </div>
                    Kelola Pendaftaran
                </a>

                <a href="kelola_beranda.html">
                    <div class="ico">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M4 16l4.586-4.586a2 2 0 0 1 2.828 0L16 16m-2-2l1.586-1.586a2 2 0 0 1 2.828 0L20 14m-6-6h.01M6 20h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2z" />
                        </svg>
                    </div>
                    Kelola Beranda
                </a>


                <a class="active" href="pengaturan_akun.html">
                    <div class="ico">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path
                                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.74v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z">
                            </path>
                            <circle cx="12" cy="12" r="3"></circle>
                        </svg>
                    </div>
                    Pengaturan Akun
                </a>
            </nav>

            <!-- Logout Button at Bottom -->
            <div class="logout-bottom">
                <a href="#" id="navLogout" class="btn-logout">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <path d="M16 17l5-5-5-5" />
                        <path d="M21 12H9" />
                    </svg>
                    <span>Logout</span>
                </a>
            </div>
        </aside>

        <!-- MAIN -->
        <main class="main">
            <div class="topbar">
                <button class="btn-hamburger" onclick="toggleSidebar()" aria-label="Toggle Sidebar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="title">
                    <h1>Pengaturan Akun</h1>
                    <p>Kelola keamanan dan preferensi akun admin Anda.</p>
                </div>
            </div>

            <div class="settings-card">
                <h2
                    style="margin: 0 0 24px 0; font-size: 20px; color: #1e293b; border-bottom: 1px solid #f1f5f9; padding-bottom: 16px;">
                    Ganti Password</h2>

                <div id="alertBox" class="alert"></div>

                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">Password Saat Ini</label>
                        <div class="password-container">
                            <input type="password" id="currentPassword" name="current_password" required
                                placeholder="Masukkan password lama">
                            <button type="button" class="password-toggle" onclick="togglePassword('currentPassword')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="newPassword">Password Baru</label>
                        <div class="password-container">
                            <input type="password" id="newPassword" name="new_password" required
                                placeholder="Minimal 8 karakter">
                            <button type="button" class="password-toggle" onclick="togglePassword('newPassword')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Konfirmasi Password Baru</label>
                        <div class="password-container">
                            <input type="password" id="confirmPassword" name="new_password_confirmation" required
                                placeholder="Ulangi password baru">
                            <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword')">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" class="btn primary" id="btnSubmit">Simpan Password Baru</button>
                    </div>
                </form>
            </div>

            <footer
                style="margin-top: 60px; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; text-align: center; font-weight: 500;">
                &copy; 2026 PKBM Harmoni. All rights reserved.
            </footer>
        </main>
    </div>

    <script>
        // --- AUTH CHECK ---
        const token = localStorage.getItem('token_admin');
        if (!token) {
            window.location.href = 'login_admin.html';
        }


        // --- LOGOUT ---
        document.getElementById('navLogout').addEventListener('click', (e) => {
            e.preventDefault();

            Swal.fire({
                title: 'Konfirmasi Logout',
                html: '<p style="color: #64748b; font-size: 15px; margin-top: 10px;">Apakah Anda yakin ingin keluar dari sistem?</p>',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                cancelButtonColor: '#64748b',
                confirmButtonText: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block; vertical-align:middle; margin-right:6px;"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg> Ya, Keluar',
                cancelButtonText: 'Batal',
                reverseButtons: true,
                backdrop: 'rgba(0,0,0,0.4)',
                customClass: {
                    popup: 'animated-popup',
                    confirmButton: 'logout-confirm-btn',
                    cancelButton: 'logout-cancel-btn'
                }
            }).then(async (result) => {
                if (result.isConfirmed) {
                    Swal.fire({
                        title: 'Sedang Keluar...',
                        html: '<p style="color: #64748b; font-size: 14px; margin-top: 10px;">Mohon tunggu sebentar</p>',
                        allowOutsideClick: false,
                        allowEscapeKey: false,
                        didOpen: () => {
                            Swal.showLoading();
                        }
                    });

                    try {
                        await fetch('/api/auth/logout', {
                            method: 'POST',
                            headers: {
                                'Authorization': 'Bearer ' + token
                            }
                        });
                    } catch (e) { }

                    localStorage.removeItem('token_admin');

                    Swal.fire({
                        icon: 'success',
                        title: 'Berhasil Keluar',
                        text: 'Anda akan dialihkan ke halaman login...',
                        timer: 1500,
                        showConfirmButton: false
                    }).then(() => {
                        window.location.href = 'login_admin.html';
                    });
                }
            });
        });


        // --- TOGGLE PASSWORD ---
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const btn = input.nextElementSibling; // The button is the next sibling

            if (input.type === "password") {
                input.type = "text";
                // Change to eye-off icon
                btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                `;
            } else {
                input.type = "password";
                // Change back to eye icon
                btn.innerHTML = `
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                        <circle cx="12" cy="12" r="3"></circle>
                    </svg>
                `;
            }
        }

        // --- FORM HANDLING ---
        const form = document.getElementById('changePasswordForm');
        const alertBox = document.getElementById('alertBox');
        const btnSubmit = document.getElementById('btnSubmit');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = 'alert ' + type;
            alertBox.style.display = 'block';
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showAlert('Konfirmasi password tidak cocok!', 'error');
                return;
            }

            if (newPassword.length < 8) {
                showAlert('Password baru minimal 8 karakter!', 'error');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.innerText = 'Menyimpan...';
            alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/change-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({
                        current_password: currentPassword,
                        new_password: newPassword,
                        new_password_confirmation: confirmPassword
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    showAlert('Password berhasil diubah!', 'success');
                    form.reset();
                } else {
                    showAlert(data.message || 'Gagal mengubah password', 'error');
                }
            } catch (err) {
                showAlert('Terjadi kesalahan koneksi', 'error');
                console.error(err);
            } finally {
                btnSubmit.disabled = false;
                btnSubmit.innerText = 'Simpan Password Baru';
            }

        });

        // Fungsi untuk menampilkan/menyembunyikan sidebar
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const overlay = document.querySelector('.sidebar-overlay');
            if (sidebar && overlay) {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
            }
        }
    </script>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" onclick="toggleSidebar()"></div>
</body>

</html>
